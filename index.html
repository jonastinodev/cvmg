<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kara-panondrom-pirenena</title>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <img src="media/drapeau-madagascar.png" alt="MG" class="flag">
      <h1>Kara-panondrom-pirenena</h1>
    </header>

    <!-- Progress bar -->
    <div class="progressbar" id="progressBar">
      <div class="step-indicator active" id="indicator1">1</div>
      <div class="step-indicator" id="indicator2">2</div>
    </div>

    <!-- Step 1 -->
    <div class="step active" id="step-upload">
      <h2>Importer document</h2>
      <label class="card">
        <span class="material-symbols-outlined">upload_file</span>
        <p>Importer (1 PDF ou 2 images recto/verso)</p>
        <input type="file" id="fileInput" hidden accept="image/*,.pdf" multiple>
      </label>
      <label class="card" id="rectoCard">
        <span class="material-symbols-outlined">photo_camera</span>
        <p>Prendre photo Recto</p>
        <input type="file" id="cameraRecto" hidden accept="image/*" capture="environment">
      </label>

      <label class="card" id="versoCard">
        <span class="material-symbols-outlined">photo_camera</span>
        <p>Prendre photo Verso</p>
        <input type="file" id="cameraVerso" hidden accept="image/*" capture="environment">
      </label>

      <div id="previewUpload"></div>
      <div class="file-info" id="fileInfo" style="display: none;"></div>
      <div class="error-message" id="errorMessage"></div>
      <div class="btn" id="uploadButtons"><!-- buttons injected dynamically --></div>
    </div>

    <!-- Step 2 -->
    <div class="step" id="step-confirm">
      <h2>Confirmation</h2>
      <p>Vos fichiers ont bien été importés. Cliquez sur <b>Suivant</b> pour lancer l'OCR.</p>
      <div id="previewConfirm"></div>
      <div class="btn" id="confirmButtons"></div>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
